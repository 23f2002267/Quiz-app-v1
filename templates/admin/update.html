<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{func}} {{object}}</title>
    <style>
        /* General styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #4a4eb1;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #4a4eb1;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border: 1px solid #4a4eb1;
            outline: none;
            box-shadow: 0px 0px 3px rgba(74, 78, 177, 0.5);
        }

        button[type="submit"] {
            padding: 10px 20px;
            background-color: #4a4eb1;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
        }

        button[type="submit"]:hover {
            background-color: #3a3e91;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4a4eb1;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .flashed-messages {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }

        .flashed-messages ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .flashed-messages li {
            margin-bottom: 5px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page Title -->
        <h2>{{func}} {{object}}  {{id}}</h2>

        <!-- Form -->
        <form method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{oname}}" required>

            <label for="description">Description:</label>
            <input type="text" id="description" name="description" value="{{odescr}}" required>

            <button type="submit">Submit</button>
        </form>

        <!-- Back to Dashboard Link -->
        <p style="text-align: center;">
            <a href="javascript:history.back()" class="back-link">Go Back</a>
        </p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
        <div class="flashed-messages">
            <ul>
                {% for category, message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        {% endwith %}
    </div>
</body>
</html>
