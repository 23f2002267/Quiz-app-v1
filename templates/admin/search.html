<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <style>
        /* General styling */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #4a4eb1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #4a4eb1;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .back-link:hover {
            background-color: #3a3e91;
        }

        .result-section {
            margin-top: 60px; /* Adjust to avoid overlapping with the back button */
            margin-bottom: 30px;
        }

        .result-section h2 {
            text-transform: capitalize;
            font-size: 20px;
            color: #4a4eb1;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin: 5px 0;
        }

        a {
            text-decoration: none;
            color: #007BFF;
        }

        a:hover {
            text-decoration: underline;
        }

        .no-matches {
            font-style: italic;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Go Back Button -->
        <a href="javascript:history.back()" class="back-link">Go Back</a>

        <!-- Search Results -->
        <h1>Search Results</h1>

        <!-- Example structure for displaying results -->
        {% for category, results in search_results.items() %}
        <div class="result-section">
            <h2>{{ category }}</h2>
            {% if results %}
            <ul>
                {% for result in results %}
                <li>
                    <a href="{{ category | lower }}/{{ result.0 }}">{{ result.1 }}</a>
                </li>
                {% endfor %}
            </ul>
            {% else %}
            <p class="no-matches">No matches</p>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
