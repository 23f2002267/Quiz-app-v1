<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        /* General styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
        }

        /* Title bar styling */
        .title-bar {
            background-color: #4a4eb1;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-bar span {
            font-size: 24px;
            font-weight: bold;
        }


        .logout a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background-color: #333;
            border-radius: 5px;
            font-weight: bold;
        }

        .logout a:hover {
            background-color: #3a3e91;
        }

        /* Navigation bar styling */
        .navbar {
            display: flex;
            justify-content: center;
            background-color: #333;
            padding: 10px 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
        }

        .navbar a:hover {
            background-color: #4a4eb1;
        }

        .container {
            padding: 120px;
        }

        h2 {
            color: brown;
        }

        /* Scrollable container styling */
        .scrollable {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #4a4eb1;
            color: white;
        }

        /* Buttons for actions */
        .action-btn {
            background-color: #4a4eb1;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 5px;
        }

        .action-btn:hover {
            background-color: #3a3e91;
        }

                /* Search bar styling */
                .search-container {
            background-color: #fff;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.2);
            margin-top: 10px;
        }

        .search-container form {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0px 40px;
        }

        .search-container input[type="text"] {
            padding: 8px;
            font-size: 14px;
            flex-grow: 1;
        }

        .search-container .dropdown {
            position: relative;
        }

        .dropdown-btn {
            background-color: #2a2b3b;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .dropdown:hover .dropdown-content {
            display: inline-block;
        }

        .dropdown-content label {
            display: block;
            margin-bottom: 5px;
        }

        .action-btn {
            background-color: #4a4eb1;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
        }

        .action-btn:hover {
            background-color: #3a3e91;
        }

        tr.hide {
            display: none; /* Hides rows when filtered */
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

    </style>
</head>
<body>
    <!-- Title Bar -->
    <div class="title-bar">
        <span>Admin Dashboard</span>
        <div class="logout">
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="{{ url_for('admin.dashboard') }}">Home</a>
        <a href="{{ url_for('admin.users') }}">Users</a>
        <a href="#dashboard">Summary Page</a>
    </div>

    <!-- Search Bar with Filters -->
    <div class="search-container container">
        <form action="/search" method="POST">
            <input type="text" id="q" name="q" placeholder="username/subject/chapter/quiz/question" required>
            <div class="dropdown">
                <button type="button" class="dropdown-btn">Filters</button>
                <div class="dropdown-content">
                    <label><input type="checkbox" name="f" value="subject"> Subjects</label>
                    <label><input type="checkbox" name="f" value="chapter"> Chapters</label>
                    <label><input type="checkbox" name="f" value="quiz"> Quizzes</label>
                    <label><input type="checkbox" name="f" value="question"> Questions</label>
                    <label><input type="checkbox" name="f" value="user"> Users</label>
                </div>
            </div>
            <button type="submit" class="action-btn">Search</button>
        </form>
    </div>

    <!-- Subjects Section -->
    <div class="container">
        <h2 style="text-align: center;">Subjects Available</h2>
        <a href="{{ url_for('admin.create_subject') }}" class="action-btn">ADD SUBJECT</a>
        <div class="scrollable">
    <!-- Search Bar -->
    <input type="text" id="search" placeholder="id/subject/description" onkeyup="filterElems()">

            <table id="subjects-table" style="margin: auto; border: 1px solid #ddd;">
                <thead>
                    <tr>
                        <th>SubID</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamic rows generated here -->
                    {% for subject in subjects %}
                    <tr>
                        <td>{{ subject.id }}</td>
                        <td>{{ subject.name }}</td>
                        <td>{{ subject.description }}</td>
                        <td>
                            <a href="/{{ subject['id'] }}/chapters" class="action-btn">View Chapters</a>
                            <a href="/{{ subject['id'] }}/update" class="action-btn">Update</a>
                            <a href="/{{ subject['id'] }}/delete" class="action-btn">Delete</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // JavaScript function to filter table rows based on search input
        function filterElems() {
            const searchInput = document.getElementById('search').value.toLowerCase();
            const table = document.getElementById('subjects-table');
            const rows = table.getElementsByTagName('tr'); // Get all rows in the table

            // Loop through all table rows except the header
            for (let i = 1; i < rows.length; i++) { // Start from 1 to skip the header row
                const cells = rows[i].getElementsByTagName('td'); // Get cells in the row
                let matchFound = false;

                // Loop through each cell in the row
                for (let cell of cells) {
                    const cellText = cell.textContent || cell.innerText;
                    if (cellText.toLowerCase().includes(searchInput)) {
                        matchFound = true;
                        break;
                    }
                }

                // Show or hide the row based on the match
                if (matchFound) {
                    rows[i].classList.remove('hide'); // Show row
                } else {
                    rows[i].classList.add('hide'); // Hide row
                }
            }
        }
    </script>

</body>
</html>
