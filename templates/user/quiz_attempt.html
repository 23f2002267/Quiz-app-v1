<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }
        .quiz-container {
            max-width: 600px;
            background: white;
            padding: 20px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: rgb(112, 92, 201);
            text-align: center;
        }
        .question {
            margin-bottom: 15px;
        }
        .options label {
            display: block;
            margin-bottom: 5px;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #4e28a7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .timer {
            font-size: 18px;
            color: #d9534f;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
    <script>
        // Timer functionality
        function startTimer(duration, form) {
            let timer = duration, minutes, seconds;
            const timerDisplay = document.getElementById('timer');
            const interval = setInterval(() => {
                minutes = Math.floor(timer / 60);
                seconds = timer % 60;

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                timerDisplay.textContent = `Time Remaining: ${minutes}:${seconds}`;

                if (--timer < 0) {
                    clearInterval(interval);
                    form.submit(); // Auto-submit the form when timer ends
                }
            }, 1000);
        }

        // Initialize the timer on page load
        window.onload = function () {
            const time = {{ time_duration }}; // Example: Default to 5 minutes (300 seconds)
            const quizForm = document.getElementById('quiz-form');
            startTimer(time, quizForm);
        };
    </script>
</head>
<body>
    <div class="quiz-container">
        <h2>Quiz Attempt</h2>
        <div id="timer" class="timer">Time Remaining: 00:00</div>
        <form id="quiz-form" action="" method="POST">
            {% for question, options in questions.items() %}
            <div class="question">
                <p><strong>{{ question }}</strong></p>
                <div class="options">
                    {% for option in options %}
                        <label>
                            <input type="radio" name="{{ question }}" value="{{ option }}">
                            {{ option }}
                        </label>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>
</body>
</html>
