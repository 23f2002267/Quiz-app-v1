<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Searchable Table</title>
    <style>
        /* General styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #4a4eb1;
            color: white;
        }

        tr.hide {
            display: none; /* Hides rows when filtered */
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h2>Search Table</h2>
    
    <!-- Search Bar -->
    <input type="text" id="search" placeholder="Search subjects..." onkeyup="filterQuestions()">
    
    <!-- Table -->
    <table id="subjects-table">
        <thead>
            <tr>
                <th>SubID</th>
                <th>Name</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Mathematics</td>
                <td>Study of numbers and formulas</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Science</td>
                <td>Understanding the natural world</td>
            </tr>
            <tr>
                <td>3</td>
                <td>History</td>
                <td>Learn about historical events</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Geography</td>
                <td>Exploration of Earth's features</td>
            </tr>
        </tbody>
    </table>

    <script>
        // JavaScript function to filter table rows based on search input
        function filterQuestions() {
            const searchInput = document.getElementById('search').value.toLowerCase();
            const table = document.getElementById('subjects-table');
            const rows = table.getElementsByTagName('tr'); // Get all rows in the table

            // Loop through all table rows except the header
            for (let i = 1; i < rows.length; i++) { // Start from 1 to skip the header row
                const cells = rows[i].getElementsByTagName('td'); // Get cells in the row
                let matchFound = false;

                // Loop through each cell in the row
                for (let cell of cells) {
                    const cellText = cell.textContent || cell.innerText;
                    if (cellText.toLowerCase().includes(searchInput)) {
                        matchFound = true;
                        break;
                    }
                }

                // Show or hide the row based on the match
                if (matchFound) {
                    rows[i].classList.remove('hide'); // Show row
                } else {
                    rows[i].classList.add('hide'); // Hide row
                }
            }
        }
    </script>
</body>
</html>
